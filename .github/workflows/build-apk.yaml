name: Build and Deploy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      job_type:
        description: '构建类型'
        required: true
        default: 'ota'
        type: choice
        options:
          - ota          # 构建并推送到 OTA 仓库
          - build-only   # 仅构建，不上传 OTA

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from build.gradle.kts
        id: get_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle.kts || grep -oP "versionName\s+'\K[^']+" app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "❌ 无法从 build.gradle.kts 中提取 versionName"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ 版本号: $VERSION_NAME"

      - name: Decode Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release-key.jks
          echo "✅ 签名文件已写入 app/release-key.jks"

      - name: Configure Signing in gradle.properties
        run: |
          echo "MYAPP_UPLOAD_STORE_FILE=release-key.jks" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties
          echo "✅ gradle.properties 已配置签名"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy and Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/SuperTV-${{ env.VERSION_NAME }}.apk
          echo "✅ APK 已生成: output/SuperTV-${{ env.VERSION_NAME }}.apk"

      - name: Upload APK artifact (for OTA)
        if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
        uses: actions/upload-artifact@v4
        with:
          name: supertv-apk
          path: output/SuperTV-${{ env.VERSION_NAME }}.apk

  ota:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: supertv-apk

      - name: Set version environment
        run: |
          VERSION="${{ needs.build.outputs.VERSION_NAME }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [ ! -f "SuperTV-$VERSION.apk" ]; then
            mv *.apk SuperTV-$VERSION.apk 2>/dev/null || true
          fi
          echo "✅ 准备推送 OTA 版本: $VERSION"

      - name: Clone OTA repository
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/${{ secrets.SYNC_REPO }}.git sync-repo

      - name: Update OTA files
        run: |
          mkdir -p sync-repo/log
          cp SuperTV-$VERSION.apk sync-repo/log/
          echo "$VERSION" > sync-repo/log/latest_version.txt
          cd sync-repo
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add log/
          git commit -m "Update OTA to version $VERSION" || exit 0
          git push
          echo "✅ OTA 已推送到 ${{ secrets.SYNC_REPO }}"