name: Build and Deploy OTA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        shell: bash
        run: |
          echo "--- Current Directory ---"
          ls -F
          echo "--- Verify Gradle Wrapper ---"
          ls -l gradlew
          chmod +x gradlew
          echo "--- Starting Gradle Build ---"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --info
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-sdk-path }}

      - name: Copy and Upload APK
        run: |
          mkdir -p output
          APK_PATH=$(find . -name "*-release.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::未找到 APK 文件！"
            ls -R app/build/outputs/apk/
            exit 1
          fi
          cp "$APK_PATH" output/SuperTV.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supertv-apk
          path: output/SuperTV.apk

  ota:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: supertv-apk

      - name: Release to OTA
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          REPO: ${{ secrets.SYNC_REPO }}
        run: |
          VERSION=$(date +%Y%m%d)
          FILE_NAME="SuperTV.apk"
          gh release upload v$VERSION $FILE_NAME --clobber || gh release create v$VERSION $FILE_NAME --title "SuperTV v$VERSION" --notes "自动 OTA 构建 $(date +'%Y-%m-%d')"
