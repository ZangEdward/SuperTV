name: Build and Deploy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      job_type:
        description: '构建类型'
        required: true
        default: 'ota'
        type: choice
        options:
          - ota
          - build-only

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from build.gradle
        id: get_version
        run: |
          # 从 app/build.gradle 中提取 versionName
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > android/app/release-key.jks

      - name: Configure Signing
        run: |
          echo "MYAPP_UPLOAD_STORE_FILE=release-key.jks" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy and Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/SuperTV-${{ env.VERSION_NAME }}.apk

      - name: Upload APK artifact
        if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
        uses: actions/upload-artifact@v4
        with:
          name: supertv-apk
          path: output/SuperTV-${{ env.VERSION_NAME }}.apk

  ota:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: supertv-apk

      - name: Set version environment
        run: |
          VERSION="${{ needs.build.outputs.VERSION_NAME }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # 确保 APK 文件名正确（如果下载时名称丢失，重命名）
          if [ ! -f "SuperTV-$VERSION.apk" ]; then
            mv *.apk SuperTV-$VERSION.apk
          fi

      - name: Clone OTA repository
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/${{ secrets.SYNC_REPO }}.git sync-repo

      - name: Update OTA files
        run: |
          # 确保 log 目录存在
          if [ -e "sync-repo/log" ] && [ ! -d "sync-repo/log" ]; then
            rm -f sync-repo/log
          fi
          mkdir -p sync-repo/log
          cp SuperTV-$VERSION.apk sync-repo/log/
          echo "$VERSION" > sync-repo/log/latest_version.txt
          cd sync-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log/
          git commit -m "Update OTA to version $VERSION" || exit 0
          git push
