name: Build and Deploy OTA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      job_type:
        description: '选择构建类型 (build-only 或 ota)'
        required: true
        default: 'ota'
        type: choice
        options:
          - ota
          - build-only
      update_notes:
        description: '请输入本次更新内容 (留空则从 README 自动获取)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          # 直接调用assembleRelease，确保编译所有Release产物
          ./gradlew assembleRelease --no-daemon

      - name: Get version
        id: get_version
        run: |
          # 动态从 android/app/build.gradle 或 build.gradle.kts 获取 versionName
          VERSION=$(grep -h "versionName" android/app/build.gradle* | head -1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION=$(date +%Y%m%d); fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Copy APK
        run: |
          mkdir -p output
          # 动态搜索生成的 Release APK，解决不同层级路径问题
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*-release.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::未找到 APK 文件！"
            find android/app/build/outputs/apk/ -name "*.apk"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" output/SuperTV-${{ env.VERSION }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supertv-apk
          path: output/SuperTV-${{ env.VERSION }}.apk

  ota:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: supertv-apk

      - name: Get Update Notes
        id: notes
        run: |
          INPUT_NOTES="${{ github.event.inputs.update_notes }}"
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            NOTES=$(sed -n '/## 已完成的重构里程碑/,/##/p' README.md | sed '1d;$d' | head -n 10 | tr '\n' ' ')
            if [ -z "$NOTES" ]; then NOTES="版本更新 ${{ env.VERSION }}"; fi
          fi
          echo "NOTES=$NOTES" >> $GITHUB_ENV

      - name: Release to OTA
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          REPO: ${{ secrets.SYNC_REPO }}
          VERSION: ${{ needs.build.outputs.VERSION }}
        run: |
          FILE_NAME="SuperTV-${{ env.VERSION }}.apk"
          gh release upload v$VERSION $FILE_NAME --clobber || gh release create v$VERSION $FILE_NAME --title "SuperTV v$VERSION" --notes "${{ env.NOTES }}"

      - name: Sync Log
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/${{ secrets.SYNC_REPO }}.git sync-repo
          mkdir -p sync-repo/log/vision
          echo "${{ env.NOTES }}" > sync-repo/log/vision/release_notes.txt
          
          cd sync-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update v${{ env.VERSION }}" || true
          git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ secrets.SYNC_REPO }}.git
