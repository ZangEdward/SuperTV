name: Build and Deploy OTA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      job_type:
        description: '选择构建类型 (build-only 或 ota)'
        required: true
        default: 'ota'
        type: choice
        options:
          - ota
          - build-only
      update_notes:
        description: '请输入本次更新内容 (留空则从 README 自动获取)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Get version
        id: get_version
        run: |
          # 提取 versionName，若失败则使用时间戳作为版本
          VERSION=$(grep "versionName" android/app/build.gradle | head -1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION=$(date +%Y%m%d); fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Copy APK
        run: |
          mkdir -p output
          # 动态搜索生成的 APK，解决路径层级问题
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found in android/app/build/outputs/apk/"
            find android/app/build/outputs/ -maxdepth 3
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" output/SuperTV-${{ env.VERSION }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supertv-apk
          path: output/SuperTV-${{ env.VERSION }}.apk

  ota:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: supertv-apk

      - name: Get Update Notes
        id: get_notes
        run: |
          INPUT_NOTES="${{ github.event.inputs.update_notes }}"
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            # 自动读取 README.md 中 "## 已完成的重构里程碑" 段落摘要
            NOTES=$(sed -n '/## 已完成的重构里程碑/,/##/p' README.md | sed '1d;$d' | head -n 10 | tr '\n' ' ')
          fi
          echo "NOTES=$NOTES" >> $GITHUB_ENV

      - name: Update metadata and Release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          REPO: ${{ secrets.SYNC_REPO }}
          VERSION: ${{ needs.build.outputs.VERSION }}
        run: |
          FILE_NAME="SuperTV-${{ env.VERSION }}.apk"
          # 使用 GitHub CLI 进行发布
          gh release upload v$VERSION $FILE_NAME --clobber || gh release create v$VERSION $FILE_NAME --title "SuperTV v$VERSION" --notes "$NOTES"

      - name: Generate alien log
        run: |
          TIMESTAMP=$(date +%s)
          LOGFILE="${TIMESTAMP}.log"
          RAW_RANDOM=$(cat /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 1000)
          
          {
            echo "📅 更新时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "📝 内容: $NOTES"
            echo "---"
            echo "流数据:"
            echo "$RAW_RANDOM" | fold -w 100
          } > ${LOGFILE}
          
          echo "Generated log: $LOGFILE"
