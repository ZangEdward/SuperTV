name: Build and Deploy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      job_type:
        description: '构建类型'
        required: true
        default: 'ota'
        type: choice
        options:
          - ota          # 构建并推送到 OTA 仓库
          - build-only   # 仅构建，不上传 OTA

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from build.gradle.kts
        id: get_version
        run: |
          # 适配 Kotlin DSL: versionName = "x.x.x.x"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "❌ 无法从 android/app/build.gradle.kts 中提取 versionName"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ 版本号: $VERSION_NAME"

      - name: Extract Secrets
        id: extract_secrets
        run: |
          echo "${{ secrets.APP_SECRETS }}" > secrets.json
          
          # 提取签名相关
          echo "SIGNING_KEY=$(jq -r '.signing_key' secrets.json)" >> $GITHUB_ENV
          echo "KEY_ALIAS=$(jq -r '.key_alias' secrets.json)" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$(jq -r '.key_password' secrets.json)" >> $GITHUB_ENV
          
          # 提取 API 节点并转义以便传递给 --dart-define
          # 我们需要将 JSON 压缩成一行，并转义双引号
          API_NODES=$(jq -c '.api_nodes_json' secrets.json | sed 's/"/\\"/g')
          # 注意：api_nodes_json 在你的 secrets_backup.json 中本身就是一个转义的字符串，
          # 我们需要获取它的原始值（即 JSON 数组）
          API_NODES_RAW=$(jq -r '.api_nodes_json' secrets.json | jq -c .)
          echo "API_NODES=$API_NODES_RAW" >> $GITHUB_ENV
          
          # 提取 OTA 相关
          echo "PAT=$(jq -r '.pat' secrets.json)" >> $GITHUB_ENV
          echo "SYNC_REPO=$(jq -r '.sync_repo' secrets.json)" >> $GITHUB_ENV
          
          echo "✅ Secrets 已提取"

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ env.SIGNING_KEY }}" | base64 --decode > android/app/release-key.jks
          echo "✅ 签名文件已写入 android/app/release-key.jks"

      - name: Configure Signing in gradle.properties
        run: |
          echo "MYAPP_UPLOAD_STORE_FILE=release-key.jks" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ env.KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ env.KEY_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ env.KEY_PASSWORD }}" >> android/gradle.properties
          echo "✅ android/gradle.properties 已配置签名"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_NODES_JSON='${{ env.API_NODES }}' \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Copy and Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/SuperTV-${{ env.VERSION_NAME }}.apk
          echo "✅ APK 已生成: output/SuperTV-${{ env.VERSION_NAME }}.apk"

      - name: Upload APK artifact (for OTA)
        if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
        uses: actions/upload-artifact@v4
        with:
          name: supertv-apk
          path: output/SuperTV-${{ env.VERSION_NAME }}.apk

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "SuperTV v${{ env.VERSION_NAME }}"
          body: |
            ## SuperTV v${{ env.VERSION_NAME }}
            
            - 构建时间: ${{ github.event.repository.updated_at }}
            - 提交: ${{ github.sha }}
          files: output/SuperTV-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ota:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: supertv-apk

      - name: Set version environment
        run: |
          VERSION="${{ needs.build.outputs.VERSION_NAME }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [ ! -f "SuperTV-$VERSION.apk" ]; then
            mv *.apk SuperTV-$VERSION.apk 2>/dev/null || true
          fi
          echo "✅ 准备推送 OTA 版本: $VERSION"

      - name: Extract Secrets for OTA
        run: |
          echo "${{ secrets.APP_SECRETS }}" > secrets.json
          echo "PAT=$(jq -r '.pat' secrets.json)" >> $GITHUB_ENV
          echo "SYNC_REPO=$(jq -r '.sync_repo' secrets.json)" >> $GITHUB_ENV

      - name: Clone OTA repository
        run: |
          git clone https://x-access-token:${{ env.PAT }}@github.com/${{ env.SYNC_REPO }}.git sync-repo

      - name: Update OTA files
        run: |
          mkdir -p sync-repo/log
          cp SuperTV-$VERSION.apk sync-repo/log/
          echo "$VERSION" > sync-repo/log/latest_version.txt
          cd sync-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log/
          git commit -m "Update OTA to version $VERSION" || exit 0
          git push
          echo "✅ OTA 已推送到 ${{ env.SYNC_REPO }}"