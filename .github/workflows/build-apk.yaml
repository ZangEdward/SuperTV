name: Build and Deploy SuperTV

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      job_type:
        description: '构建类型'
        required: true
        default: 'ota'
        type: choice
        options:
          - ota          # 构建并推送到 OTA 仓库
          - build-only   # 仅构建，不上传 OTA

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from build.gradle.kts
        id: get_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "❌ 无法从 android/app/build.gradle.kts 中提取 versionName"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ 版本号: $VERSION_NAME"

      - name: Set Environment Variables
        run: |
          echo "SIGNING_KEY=${{ secrets.SIGNING_KEY }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "API_NODES<<EOF" >> $GITHUB_ENV
          echo '${{ secrets.API_NODES_JSON }}' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "PAT=${{ secrets.PAT }}" >> $GITHUB_ENV
          echo "SYNC_REPO=${{ secrets.SYNC_REPO }}" >> $GITHUB_ENV
          echo "✅ 环境变量已设置"

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ env.SIGNING_KEY }}" | base64 --decode > android/app/release-key.jks
          echo "✅ 签名文件已写入 android/app/release-key.jks"

      - name: Configure Signing in key.properties
        run: |
          echo "storeFile=release-key.jks" >> android/key.properties
          echo "storePassword=${{ env.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ env.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ env.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ android/key.properties 已配置签名"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_NODES_JSON='${{ env.API_NODES }}' \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Copy and Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/SuperTV-v${{ env.VERSION_NAME }}-Android.apk
          echo "✅ APK 已生成: output/SuperTV-v${{ env.VERSION_NAME }}-Android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supertv-apk
          path: output/SuperTV-v${{ env.VERSION_NAME }}-Android.apk

      - name: Create GitHub Release (APK)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "SuperTV v${{ env.VERSION_NAME }}"
          files: output/SuperTV-v${{ env.VERSION_NAME }}-Android.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    needs: build-apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set Environment Variables
        shell: pwsh
        run: |
          echo "API_NODES=${{ secrets.API_NODES_JSON }}" >> $env:GITHUB_ENV
          echo "✅ 环境变量已设置"

      - name: Build Windows
        run: |
          flutter build windows --release --dart-define=API_NODES_JSON='${{ env.API_NODES }}'

      - name: Package Windows
        shell: pwsh
        run: |
          $VERSION = "${{ needs.build-apk.outputs.VERSION_NAME }}"
          $BUILD_DIR = "build/windows/x64/runner/Release"
          $OUTPUT_DIR = "output"
          New-Item -ItemType Directory -Force -Path $OUTPUT_DIR
          Compress-Archive -Path "$BUILD_DIR/*" -DestinationPath "$OUTPUT_DIR/SuperTV-v$VERSION-Windows.zip"
          echo "✅ Windows 包已生成: $OUTPUT_DIR/SuperTV-v$VERSION-Windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: supertv-windows
          path: output/SuperTV-v*-Windows.zip

      - name: Update GitHub Release (Windows)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-apk.outputs.VERSION_NAME }}
          files: output/SuperTV-v*-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ota:
    needs: build-apk
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.job_type == 'ota' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: supertv-apk

      - name: Set version environment
        run: |
          VERSION="${{ needs.build-apk.outputs.VERSION_NAME }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv SuperTV-v$VERSION-Android.apk SuperTV-$VERSION.apk 2>/dev/null || true
          echo "✅ 准备推送 OTA 版本: $VERSION"

      - name: Set Environment Variables for OTA
        run: |
          echo "PAT=${{ secrets.PAT }}" >> $GITHUB_ENV
          echo "SYNC_REPO=${{ secrets.SYNC_REPO }}" >> $GITHUB_ENV

      - name: Clone OTA repository
        run: |
          git clone https://x-access-token:${{ env.PAT }}@github.com/${{ env.SYNC_REPO }}.git sync-repo

      - name: Update OTA files
        run: |
          mkdir -p sync-repo/log
          cp SuperTV-$VERSION.apk sync-repo/log/
          echo "$VERSION" > sync-repo/log/latest_version.txt
          cd sync-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log/
          git commit -m "Update OTA to version $VERSION" || exit 0
          git push
          echo "✅ OTA 已推送到 ${{ env.SYNC_REPO }}"
