name: Deploy Web Demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      API_NODES_JSON: ${{ secrets.API_NODES_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Prepare Build Configuration
        shell: bash
        run: |
          # 压缩 JSON 为单行并移除换行符，确保注入成功
          python3 -c "import os, json; nodes = os.environ.get('API_NODES_JSON', '').strip().replace('\n', '').replace('\r', ''); print(json.dumps({'API_NODES_JSON': nodes}))" > dart_config.json
          echo "✅ dart_config.json 已生成"

      - name: Build Web
        run: |
          # 默认使用 / 作为 base-href，以支持自定义域名。
          # 如果您是在 username.github.io/repo-name/ 下访问，请确保 base-href 包含仓库名。
          flutter build web --release \
            --dart-define-from-file=dart_config.json \
            --base-href "/"
          
          # 复制 index.html 到 404.html 以支持 SPA 路由
          cp build/web/index.html build/web/404.html
          echo "✅ Web 构建完成，已生成 404.html"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Deploy Web Demo for UI Showcase"
