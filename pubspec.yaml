name: supertv
description: "A MoonTV-based Video Player."
publish_to: 'none'

version: 6.0.0+6000

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10+1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  lucide_icons_flutter: ^3.1.14+1
  provider: ^6.1.2
  web_socket_channel: ^3.0.3
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  dio: ^5.4.0
  gal: ^2.3.0
  app_settings: ^7.0.0
  gbk_codec: ^0.4.0
  scrollable_positioned_list: ^0.3.8
  dlna_dart: ^0.1.0
  macos_window_utils: ^1.5.1
  media_kit: ^1.2.3
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  package_info_plus: ^8.0.0
  bitsdojo_window: ^0.1.6
  volume_controller: ^3.4.0
  screen_brightness: ^2.1.7
  gpt_markdown: 1.0.9
  bs58check: ^1.0.2
  xml: ^6.5.0
  intl: ^0.20.2
  pip: ^0.0.3
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
